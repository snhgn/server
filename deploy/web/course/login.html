<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#f4f8f4" id="themeColorMeta">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>🌲 BJFU 课表 — 登录</title>
<script>
  (function () {
    var pref = localStorage.getItem('themePref') || 'auto';
    var isDark = pref === 'dark' ||
      (pref !== 'light' && window.matchMedia &&
       window.matchMedia('(prefers-color-scheme: dark)').matches);
    document.documentElement.setAttribute('data-theme', isDark ? 'dark' : 'light');
    var meta = document.getElementById('themeColorMeta');
    if (meta) {
      var color = isDark ? '#121212' : '#f4f8f4';
      meta.setAttribute('content', color);
    }
  })();
</script>
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<link rel="stylesheet" href="./static/css/course.css?v=20260908_1000">
<link rel="stylesheet" href="./static/css/login.css?v=20260908_1000">
</head>
<body>
<main class="wrap login-wrap">

  <div class="login-card">
    <!-- Logo & Branding -->
    <div class="login-brand">
      <div class="login-icon">🌲</div>
      <h1>BJFU 课表</h1>
      <p class="login-subtitle">北京林业大学教务课表同步</p>
    </div>

    <!-- Login Form -->
    <form id="loginForm" autocomplete="off">
      <div class="field">
        <label for="studentId">学号</label>
        <input type="text" id="studentId" placeholder="请输入学号"
               pattern="\d{8,}" required autocomplete="username" inputmode="numeric">
      </div>

      <div class="field">
        <label for="password">密码</label>
        <div class="password-wrap">
          <input type="password" id="password" placeholder="教务系统密码"
                 required autocomplete="current-password">
          <button type="button" id="togglePwd" class="toggle-pwd" aria-label="显示密码" tabindex="-1">
            <svg id="eyeIcon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
              <circle cx="12" cy="12" r="3"/>
            </svg>
          </button>
        </div>
      </div>

      <!-- Save Credentials Option -->
      <label class="checkbox-row" for="saveCredentials">
        <input type="checkbox" id="saveCredentials">
        <span class="checkmark"></span>
        <span class="checkbox-label">记住账号密码</span>
        <span class="checkbox-hint">（仅保存在本设备浏览器中）</span>
      </label>

      <!-- Status Message -->
      <div id="statusMsg" class="status-msg"></div>

      <!-- Submit Button -->
      <button type="submit" id="submitBtn" class="submit-btn">
        <span id="btnText">同步课表</span>
        <span id="btnSpinner" class="spinner hidden"></span>
      </button>
    </form>

    <!-- Footer Info -->
    <div class="login-footer">
      <p>密码仅用于一次性登录教务系统抓取课表</p>
      <p>选择「记住密码」后将以明文保存在本设备浏览器 localStorage 中</p>
    </div>

    <!-- Theme Toggle -->
    <button id="themeBtn" class="theme-toggle" aria-label="切换深浅色主题" title="切换主题">🌙</button>
  </div>

</main>

<script src="./static/js/login.js?v=20260908_1000"></script>
</body>
</html>
