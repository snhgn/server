<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <style>
    .bg-card { fill: #FAFAFA; stroke: #E5E7EB; }
    .cross-line { stroke: #18181B; }
    .center-dot { fill: #EAB308; }
    .center-inner { fill: #FFFFFF; }
    @media (prefers-color-scheme: dark) {
      .bg-card { fill: #18181B; stroke: #27272A; }
      .cross-line { stroke: #F4F4F5; }
      .center-dot { fill: #FACC15; }
      .center-inner { fill: #18181B; }
    }
  </style>
  <rect class="bg-card" x="1.5" y="1.5" width="29" height="29" rx="7" stroke-width="1.2" />
  <line class="cross-line" x1="16" y1="6.5" x2="16" y2="25.5" stroke-width="2.2" stroke-linecap="round" />
  <line class="cross-line" x1="6.5" y1="16" x2="25.5" y2="16" stroke-width="2.2" stroke-linecap="round" />
  <circle class="center-dot" cx="16" cy="16" r="3.2" />
  <circle class="center-inner" cx="16" cy="16" r="1.2" />
</svg>
