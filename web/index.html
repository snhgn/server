<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="snhgn.me — Personal Hub. Building. Learning. Recording." />
    <title>snhgn.me</title>
    <script>
      (function() {
        var mode = localStorage.getItem('bjfu-theme-mode') || localStorage.getItem('snhgn-theme') || 'auto';
        var isDark = mode === 'dark' || (mode === 'auto' && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
        var t = isDark ? 'dark' : 'light';
        document.documentElement.setAttribute('data-theme', t);
        if (isDark) document.documentElement.classList.add('dark');
      })();
      // 立即注销旧 Service Worker 并清理所有 CacheStorage 缓存
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(function(regs) {
          for (var i = 0; i < regs.length; i++) { regs[i].unregister(); }
        });
      }
      if (window.caches) {
        caches.keys().then(function(keys) {
          for (var i = 0; i < keys.length; i++) { caches.delete(keys[i]); }
        });
      }
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
